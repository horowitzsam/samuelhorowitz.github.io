<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sam Horowitz</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>S</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .container {
            text-align: center;
            max-width: 600px;
        }

        .name {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }

        .tagline {
            font-size: 1.25rem;
            color: #94a3b8;
            margin-bottom: 3rem;
        }

        /* Apps Section - Uncomment and customize when ready */
        .apps {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
            margin-bottom: 3rem;
        }

        .app-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 1.5rem 2rem;
            text-decoration: none;
            color: white;
            transition: all 0.2s ease;
            min-width: 200px;
        }

        .app-card:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .app-card h3 {
            font-size: 1.125rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .app-card p {
            font-size: 0.875rem;
            color: #94a3b8;
        }

        .app-card.coming-soon {
            opacity: 0.5;
            cursor: default;
        }

        .app-card.coming-soon:hover {
            transform: none;
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .contact {
            margin-top: 2rem;
        }

        .contact a {
            color: #60a5fa;
            text-decoration: none;
            font-size: 1rem;
        }

        .contact a:hover {
            text-decoration: underline;
        }

        /* Hide apps section until you have apps to show */
        .apps.hidden {
            display: none;
        }

        .coming-soon-message {
            color: #64748b;
            font-size: 1rem;
            margin-bottom: 2rem;
        }

        @media (max-width: 480px) {
            .name {
                font-size: 2.25rem;
            }

            .tagline {
                font-size: 1rem;
            }

            .app-card {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="name">Sam Horowitz</h1>
        <p class="tagline">Tools & Applications</p>

        <p class="coming-soon-message">New apps coming soon.</p>

        <!--
        =============================================
        HOW TO ADD APPS:

        1. Delete the "coming-soon-message" paragraph above
        2. Remove "hidden" from the apps div class below
        3. Copy an app-card block and customize it

        Example app card:
        <a href="https://your-app-url.com" class="app-card">
            <h3>App Name</h3>
            <p>Short description of what it does</p>
        </a>
        =============================================
        -->

        <div class="apps hidden">
            <!-- App 1 - Example (customize or delete) -->
            <a href="#" class="app-card">
                <h3>App Name</h3>
                <p>Brief description here</p>
            </a>

            <!-- App 2 - Coming Soon Example -->
            <div class="app-card coming-soon">
                <h3>Another App</h3>
                <p>Coming soon</p>
            </div>
        </div>

        <div class="contact">
            <a href="mailto:horowitz.sam@gmail.com">horowitz.sam@gmail.com</a>
        </div>
    </div>
</body>
</html>
